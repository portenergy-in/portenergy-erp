# (c) 2026 Port Energy Private Limited
# Builds the Android app (APK) on GitHub's servers and publishes it on the Releases page.
# Runs by hand: Actions > Build Android APK > Run workflow (also when android/ changes).
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Create signing key for this build
        run: |
          PW=$(openssl rand -hex 16)
          echo "::add-mask::$PW"
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias portenergy -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Port Energy ERP, O=Port Energy Private Limited, C=IN"
          echo "PE_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "PE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PortEnergyERP-android.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Port Energy ERP Android app - build ${{ github.run_number }}
          make_latest: false
          body: |
            Download PortEnergyERP-android.apk on the phone and open it (allow install from this source once).
            If an older Port Energy app is already installed, uninstall it first.
            The app opens https://portenergy-in.github.io/portenergy-erp/app/ , so website updates reach the app automatically.
          files: PortEnergyERP-android.apk
